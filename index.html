<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Расписание занятий — неделя</title>
<style>
  :root{
    --bg: #f7f9fc;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --muted: #64748b;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --even: #ecfdf5;
    --odd: #fef3c7;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
    padding: 24px 16px 48px;
  }
  header{
    max-width: 1200px;
    margin: 0 auto 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  h1{ font-size: 1.5rem; margin: 0; font-weight: 700; }
  .meta{ display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .badge{
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: .85rem;
    font-weight: 600;
    border: 1px solid transparent;
  }
  .badge.week{ background: var(--accent-soft); color: var(--accent); border-color: #bfdbfe; }
  .badge.even{ background: var(--even); color: #047857; border-color: #a7f3d0; }
  .badge.odd { background: var(--odd);  color: #b45309; border-color: #fde68a; }
  .nav{ display: flex; gap: 8px; flex-wrap: wrap; }
  button{
    font: inherit;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: .15s;
  }
  button:hover{ background: #f1f5f9; }
  button.primary{ background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover{ background: #1d4ed8; }

  .calendar-wrapper{
    max-width: 1200px;
    margin: 0 auto;
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .calendar{
    display: grid;
    grid-template-columns: 90px repeat(7, minmax(140px, 1fr));
    min-width: 900px;
  }
  .calendar > div{
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 8px;
    min-height: 92px;
  }
  .calendar > div:nth-child(8n){ border-right: none; }

  .head{
    background: #f1f5f9;
    font-weight: 700;
    text-align: center;
    font-size: .9rem;
    min-height: auto;
    padding: 10px 6px;
    position: sticky;
    top: 0;
    z-index: 2;
  }
  .head.today{ background: var(--accent); color: #fff; }
  .head .date{ display: block; font-weight: 400; font-size: .78rem; opacity: .85; }

  .time-cell{
    background: #f8fafc;
    font-size: .8rem;
    color: var(--muted);
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    font-weight: 600;
  }
  .time-cell .pair-num{ color: var(--text); font-size: .95rem; }

  .lesson{ background: #fff; display: flex; flex-direction: column; gap: 4px; }
  .lesson .title{ font-weight: 600; font-size: .88rem; }
  .lesson .teacher{ font-size: .8rem; color: var(--muted); }
  .lesson .time{ font-size: .75rem; color: var(--muted); }
  .lesson a{
    margin-top: auto;
    font-size: .8rem;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    align-self: flex-start;
    border-bottom: 1px dashed var(--accent);
  }
  .lesson a:hover{ color: #1d4ed8; border-bottom-style: solid; }

  .empty{ background: #fbfdff; }

  @media (max-width: 960px){
    .calendar-wrapper{ overflow-x: auto; }
  }
</style>
</head>
<body>

<header>
  <h1>Расписание занятий</h1>
  <div class="meta">
    <span class="badge week" id="weekNum">—</span>
    <span class="badge" id="weekType">—</span>
    <span class="badge week" id="weekRange">—</span>
  </div>
</header>

<div class="calendar-wrapper" style="margin-bottom:16px;">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;gap:12px;flex-wrap:wrap;">
    <div class="nav">
      <button id="prevBtn">← Предыдущая</button>
      <button id="todayBtn" class="primary">Сегодня</button>
      <button id="nextBtn">Следующая →</button>
    </div>
    <div style="font-size:.85rem;color:var(--muted);">
      <b style="color:var(--text)">Чётная:</b> ПН — нет; ВТ — 2 пары ИСУ; СР — 1 ТПР; ЧТ — 1 СисИнж; ПТ — 1 МИиМ; СБ — 2 пары.
      &nbsp;|&nbsp;
      <b style="color:var(--text)">Нечётная:</b> ПН — 2 ОНИ; ВТ — практика + ИСУ; СР — 2 ТПР; ЧТ — 2 СисИнж; ПТ — 2 МИиМ; СБ — 1 (практикум).
    </div>
  </div>
</div>

<div class="calendar-wrapper">
  <div class="calendar" id="calendar"></div>
</div>

<script>
/* =========================================================================
   1. ВРЕМЯ ПАР (по умолчанию)
   -------------------------------------------------------------------------
   Меняйте здесь, если поменяется стандартное время.
   ========================================================================= */
const PAIR_TIMES = {
  1: { start: "08:30", end: "09:50" },
  2: { start: "10:00", end: "11:20" },
  7: { start: "18:00", end: "19:20" },
  8: { start: "19:30", end: "20:50" },
};

/* =========================================================================
   2. СДВИГ ЧЁТНОСТИ
   -------------------------------------------------------------------------
   Чётность = ((weekNumber + WEEK_OFFSET) % 2 === 0).
   Сейчас WEEK_OFFSET = 1, чтобы текущая неделя была ЧЁТНОЙ.
   Если нужно сдвинуть наоборот — поменяйте на 0.
   ========================================================================= */
const WEEK_OFFSET = 1;

/* =========================================================================
   3. ДАННЫЕ РАСПИСАНИЯ
   -------------------------------------------------------------------------
   Поле weeks:
     "all"  — каждую неделю
     "even" — только чётная
     "odd"  — только нечётная

   Как добавлять новую дисциплину — просто скопируйте объект и поменяйте поля.
   ========================================================================= */
const lessons = [
  /* ===================== ПОНЕДЕЛЬНИК ===================== */
  // Нечётная: 2 пары ОНИ
  {
    day: 1, pair: 7, weeks: "odd",
    title: "Основы научных исследований в области анализа данных (лек)",
    teacher: "Штанов Юрий Николаевич",
    url: "https://telemost.yandex.ru/j/87868338394305"
  },
  {
    day: 1, pair: 8, weeks: "odd",
    title: "Основы научных исследований в области анализа данных (пр)",
    teacher: "Штанов Юрий Николаевич",
    url: "https://telemost.yandex.ru/j/87868338394305"
  },

  /* ===================== ВТОРНИК ===================== */
  // Нечётная: 7 — учебная практика, 8 — ИСУ (лаб)
  {
    day: 2, pair: 7, weeks: "odd",
    title: "Учебная практика (технологическая)",
    teacher: "Еловой Сергей Григорьевич",
    url: "https://telemost.yandex.ru/j/09406274253983"
  },
  // Чётная: 8 — ИСУ (лаб); Нечётная: 8 — ИСУ (лаб)
  {
    day: 2, pair: 8, weeks: "all",
    title: "Иерархические системы управления (лаб)",
    teacher: "Гордеев Александр Сергеевич",
    url: "https://telemost.yandex.ru/j/72466509162065"
  },

  /* ===================== СРЕДА ===================== */
  // Чётная: 7 — ТПР; Нечётная: 7 и 8 — ТПР
  {
    day: 3, pair: 7, weeks: "all",
    title: "Теория принятия решений (лек/лаб)",
    teacher: "Григоренко Виолетта Вячеславовна",
    url: "https://telemost.yandex.ru/j/42325111466351"
  },
  {
    day: 3, pair: 8, weeks: "odd",
    title: "Теория принятия решений (лаб)",
    teacher: "Григоренко Виолетта Вячеславовна",
    url: "https://telemost.yandex.ru/j/42325111466351"
  },

  /* ===================== ЧЕТВЕРГ ===================== */
  // Чётная: 7 — СисИнж; Нечётная: 7 и 8 — СисИнж
  {
    day: 4, pair: 7, weeks: "all",
    title: "Системная инженерия (лек/пр)",
    teacher: "Григоренко Виолетта Вячеславовна",
    url: "https://telemost.yandex.ru/j/42325111466351"
  },
  {
    day: 4, pair: 8, weeks: "odd",
    title: "Системная инженерия (пр)",
    teacher: "Григоренко Виолетта Вячеславовна",
    url: "https://telemost.yandex.ru/j/42325111466351"
  },

  /* ===================== ПЯТНИЦА ===================== */
  // Чётная: 7 — МИиМ; Нечётная: 7 и 8 — МИиМ
  {
    day: 5, pair: 7, weeks: "all",
    title: "Методы исследования и моделирование информационных систем (лек/лаб)",
    teacher: "Берестин Дмитрий Константинович",
    url: "https://telemost.yandex.ru/j/30370533590592"
  },
  {
    day: 5, pair: 8, weeks: "odd",
    title: "Методы исследования и моделирование информационных систем (лаб)",
    teacher: "Берестин Дмитрий Константинович",
    url: "https://telemost.yandex.ru/j/30370533590592"
  },

  /* ===================== СУББОТА ===================== */
  // Чётная: 1 и 2 пары; Нечётная: только 2 (практикум)
  {
    day: 6, pair: 1, weeks: "even",
    title: "История и методология науки (пр)",
    teacher: "Никулина Ольга Вячеславовна",
    url: "https://telemost.yandex.ru/j/69527416643165"
  },
  {
    day: 6, pair: 2, weeks: "all",
    title: "Практикум по межкультурной коммуникации (пр)",
    teacher: "Сердюкова Александра Михайловна",
    url: "https://telemost.yandex.ru/j/03338223589531"
  }
];

/* =========================================================================
   4. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
   ========================================================================= */
const DAY_NAMES = ["ПН", "ВТ", "СР", "ЧТ", "ПТ", "СБ", "ВС"];
const GORDEEV_TEACHER = "Гордеев Александр Сергеевич";

/** Понедельник недели, в которую попадает дата */
function getMonday(date){
  const d = new Date(date);
  const day = d.getDay(); // 0 = вс
  const diff = (day === 0 ? -6 : 1 - day);
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}

/** Номер недели в году (ISO) */
function getWeekNumber(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

function formatShortDate(d){
  const dd = String(d.getDate()).padStart(2, "0");
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  return `${dd}.${mm}`;
}

/** Чётность недели с учётом сдвига */
function isEvenWeek(weekNumber){
  return (weekNumber + WEEK_OFFSET) % 2 === 0;
}

/** Показывать ли пару на этой неделе */
function isLessonVisible(lesson, even){
  if (lesson.weeks === "even") return even;
  if (lesson.weeks === "odd")  return !even;
  return true; // "all"
}

/** Время пары (с учётом исключения для Гордеева) */
function getLessonTime(lesson, even){
  if (lesson.teacher === GORDEEV_TEACHER) {
    // Какие пары Гордеева видны в этот день на этой неделе?
    const dayLessons = lessons.filter(l =>
      l.day === lesson.day &&
      l.teacher === GORDEEV_TEACHER &&
      isLessonVisible(l, even)
    );
    const has7 = dayLessons.some(l => l.pair === 7);
    const has8 = dayLessons.some(l => l.pair === 8);

    if (has7 && has8) {
      if (lesson.pair === 7) return { start: "19:00", end: "20:20" };
      if (lesson.pair === 8) return { start: "20:30", end: "21:50" };
    }
    // если только 8 — стандартное 19:30–20:50
  }
  return PAIR_TIMES[lesson.pair] || { start: "—", end: "—" };
}

function escapeHtml(str){
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/* =========================================================================
   5. СОСТОЯНИЕ И НАВИГАЦИЯ
   ========================================================================= */
// Смещение недели относительно текущей (0 = текущая, -1 = прошлая, +1 = следующая)
let weekOffset = 0;

/** Возвращает дату понедельника отображаемой недели */
function getDisplayedMonday(){
  const d = new Date();
  d.setDate(d.getDate() + weekOffset * 7);
  return getMonday(d);
}

/* =========================================================================
   6. РЕНДЕР
   ========================================================================= */
function renderCalendar(){
  const today = new Date();
  const monday = getDisplayedMonday();
  const weekNumber = getWeekNumber(monday);
  const even = isEvenWeek(weekNumber);

  // Заголовки
  document.getElementById("weekNum").textContent = `Неделя №${weekNumber}`;
  const typeEl = document.getElementById("weekType");
  typeEl.textContent = even ? "Чётная неделя" : "Нечётная неделя";
  typeEl.className = "badge " + (even ? "even" : "odd");

  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  document.getElementById("weekRange").textContent =
    `${formatShortDate(monday)} — ${formatShortDate(sunday)}` +
    (weekOffset === 0 ? " (текущая)" : weekOffset < 0 ? " (прошлая)" : " (следующая)");

  const calendar = document.getElementById("calendar");
  calendar.innerHTML = "";

  // Набор пар
  const pairNumbers = Array.from(new Set([
    1, 2, 7, 8,
    ...lessons.map(l => l.pair)
  ])).sort((a, b) => a - b);

  // Шапка
  calendar.appendChild(createCell("head", ""));
  for (let i = 0; i < 7; i++){
    const dayDate = new Date(monday);
    dayDate.setDate(monday.getDate() + i);
    const isToday = dayDate.toDateString() === today.toDateString();
    const cell = document.createElement("div");
    cell.className = "head" + (isToday ? " today" : "");
    cell.innerHTML = `${DAY_NAMES[i]}<span class="date">${formatShortDate(dayDate)}</span>`;
    calendar.appendChild(cell);
  }

  // Строки
  pairNumbers.forEach(pairNum => {
    const timeCell = document.createElement("div");
    timeCell.className = "time-cell";
    const t = PAIR_TIMES[pairNum] || { start: "—", end: "—" };
    timeCell.innerHTML = `
      <span class="pair-num">${pairNum} пара</span>
      <span>${t.start}–${t.end}</span>
    `;
    calendar.appendChild(timeCell);

    for (let day = 1; day <= 7; day++){
      const cell = document.createElement("div");
      cell.className = "empty";

      const dayLessons = lessons.filter(l =>
        l.day === day &&
        l.pair === pairNum &&
        isLessonVisible(l, even)
      );

      if (dayLessons.length === 0){
        calendar.appendChild(cell);
        continue;
      }

      cell.className = "lesson";
      dayLessons.forEach(l => {
        const block = document.createElement("div");
        const timeInfo = getLessonTime(l, even);

        let html = `<div class="title">${escapeHtml(l.title)}</div>`;
        if (l.teacher) html += `<div class="teacher">${escapeHtml(l.teacher)}</div>`;
        if (timeInfo)  html += `<div class="time">${timeInfo.start}–${timeInfo.end}</div>`;
        if (l.url)     html += `<a href="${l.url}" target="_blank" rel="noopener">Подключиться</a>`;

        block.innerHTML = html;
        cell.appendChild(block);
      });

      calendar.appendChild(cell);
    }
  });
}

function createCell(cls, html){
  const d = document.createElement("div");
  d.className = cls;
  d.innerHTML = html;
  return d;
}

/* =========================================================================
   7. ЗАПУСК И НАВИГАЦИЯ
   ========================================================================= */
document.getElementById("prevBtn").addEventListener("click", () => {
  weekOffset -= 1;
  renderCalendar();
});
document.getElementById("nextBtn").addEventListener("click", () => {
  weekOffset += 1;
  renderCalendar();
});
document.getElementById("todayBtn").addEventListener("click", () => {
  weekOffset = 0;
  renderCalendar();
});

renderCalendar();

/* =========================================================================
   ИНСТРУКЦИЯ ПО ДЕПЛОЮ НА GITHUB PAGES
   -------------------------------------------------------------------------
   1. Создайте аккаунт на github.com (если ещё нет).
   2. New repository → имя, например, schedule → Public → Create.
   3. Add file → Upload files → загрузите index.html → Commit changes.
   4. Settings → Pages → Source: Deploy from a branch.
      Branch: main, папка: / (root) → Save.
   5. Через 1–2 минуты страница будет доступна по адресу:
        https://<ваш-логин>.github.io/<имя-репозитория>/
   ========================================================================= */
</script>
</body>
</html>
